name: Bug report
description: Report reproducible Relay Shell behavior.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest application, layout, and key sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Relay Shell version, Node.js version, terminal, and operating system.
    validations:
      required: true
