name: Feature request
description: Suggest a focused improvement to terminal application shells.
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the terminal application that is currently difficult to assemble.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request concerns layout, focus, keybindings, or the status bar rather than a specific widget.
          required: true
